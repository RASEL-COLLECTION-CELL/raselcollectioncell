<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="robots" content="noindex, nofollow">
<title>Rasel Collection Cell</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #050505; overflow: hidden; }
  #muat {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #d9b45a; font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing: .08em; transition: opacity .4s;
  }
  #muat.selesai { opacity: 0; pointer-events: none; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #050505; }
</style>
</head>
<body>
<div id="muat">Memuat…</div>
<iframe id="app"
  src="https://script.google.com/macros/s/AKfycbxJVi3KPfExlwzTyw31qGIcfyQHW8bckUWycCCnsO0NoBmFxeCUmeQNBUNvvdRCEUmf/exec"
  title="Rasel Collection Cell"
  allow="clipboard-write"
  referrerpolicy="no-referrer"></iframe>
<script>
  document.getElementById('app').addEventListener('load', function () {
    document.getElementById('muat').classList.add('selesai');
  });
</script>
<noscript>Aktifkan JavaScript untuk membuka halaman ini.</noscript>
</body>
</html>
