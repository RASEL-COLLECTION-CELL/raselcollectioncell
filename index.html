<style>
:root{
  --bg:#05060d; --bg2:#0b0d1c; --gold:#e9c978; --gold-d:#c8913a; --gold-l:#ffe9a8;
  --ink:rgba(233,201,120,.92); --mute:rgba(233,201,120,.6);
  --ease:cubic-bezier(.2,.7,.2,1);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050505;z-index:1}

/* ===== Layar pembuka ===== */
#muat{
  position:fixed;inset:0;z-index:2;overflow:hidden;color:var(--gold);font-family:var(--font);
  background:
    radial-gradient(120% 46% at 50% 106%,rgba(235,165,60,.38),rgba(150,80,25,.14) 42%,transparent 72%),
    radial-gradient(70% 40% at 88% 6%,rgba(70,80,170,.22),transparent 70%),
    linear-gradient(180deg,#01020a 0%,#060818 45%,#0d0b17 75%,#150e0a 100%);
  transition:opacity .7s ease,transform .9s ease;
}
#muat.selesai{opacity:0;transform:scale(1.04);pointer-events:none}

.langit{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 1.6s ease}
.langit.siap{opacity:1}

.bulan{position:absolute;top:calc(8% + env(safe-area-inset-top,0px));right:12%;width:52px;height:52px;border-radius:50%;
  box-shadow:inset -13px -6px 0 0 #f6e7b4;transform:rotate(-12deg);filter:drop-shadow(0 0 14px rgba(246,231,180,.5))}
.meteor{position:absolute;top:10%;left:68%;width:110px;height:2px;border-radius:2px;opacity:0;
  background:linear-gradient(90deg,rgba(255,240,200,0),rgba(255,240,200,.95));
  animation:jatuh 11s linear 2s infinite}
.m2{top:22%;left:92%;animation-delay:6s;animation-duration:13s}
.m3{top:4%;left:38%;animation-delay:9.5s;animation-duration:16s}
@keyframes jatuh{0%{opacity:0;transform:translate(0,0) rotate(-32deg)}
  3%{opacity:1}10%,100%{opacity:0;transform:translate(-260px,164px) rotate(-32deg)}}
.vinyet{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(0,0,0,.6) 100%)}

.panggung{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(120px + env(safe-area-inset-bottom,0px))}
.u{animation:naik .9s var(--ease) both;animation-delay:var(--t,0s)}
@keyframes naik{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* lambang: satu-satunya titik fokus */
.lambang{position:relative;width:128px;height:128px;margin-bottom:28px}
.lambang::before{content:"";position:absolute;inset:-54px;border-radius:50%;
  background:radial-gradient(circle,rgba(233,180,80,.32),rgba(233,180,80,.08) 46%,transparent 70%);
  animation:napas 3.6s ease-in-out infinite}
.lambang svg{position:relative;display:block;width:100%;height:100%;filter:drop-shadow(0 10px 22px rgba(0,0,0,.6))}
.cincin{transform-origin:60px 60px;animation:putar 1.6s linear infinite}
@keyframes putar{to{transform:rotate(360deg)}}
@keyframes napas{0%,100%{transform:scale(.92);opacity:.65}50%{transform:scale(1.06);opacity:1}}
.goyang{animation:apung 3.8s ease-in-out infinite}
@keyframes apung{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
.kedip{transform-box:fill-box;transform-origin:center;animation:mata 5s infinite}
@keyframes mata{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

.merek{margin:0;font-weight:800;font-size:clamp(34px,11vw,52px);letter-spacing:.2em;text-indent:.2em;line-height:1.05;
  background:linear-gradient(100deg,#b98a2e 0%,#ffe9a8 35%,#d9a441 55%,#ffe9a8 78%,#b98a2e 100%);
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 2px 14px rgba(217,164,65,.3))}
.merek.u{animation:naik .9s var(--ease) both,kilau 4s linear 1s infinite}
@keyframes kilau{to{background-position:-220% 0}}
.sub{margin-top:8px;font-weight:600;font-size:clamp(13px,3.8vw,16px);letter-spacing:.34em;text-indent:.34em;color:var(--ink)}
.garis{display:flex;align-items:center;gap:10px;margin:22px 0 14px}
.garis span{width:56px;height:1px;background:linear-gradient(90deg,transparent,rgba(233,201,120,.75))}
.garis span:last-child{transform:scaleX(-1)}
.garis i{width:6px;height:6px;transform:rotate(45deg);background:var(--gold-d);box-shadow:0 0 8px rgba(217,164,65,.8)}
.tagline{font-size:14px;font-weight:400;color:var(--mute)}

.status{margin-top:34px;min-height:20px;font-size:14px;font-weight:600;color:var(--ink)}
#teks{transition:opacity .25s ease}
.batang{margin:14px auto 0;width:min(220px,58vw);height:3px;border-radius:3px;background:rgba(233,201,120,.14);overflow:hidden}
.batang b{display:block;height:100%;width:8%;border-radius:3px;
  background:linear-gradient(90deg,#c8913a,#ffe29a);transition:width 1.2s var(--ease)}

.bantuan{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
  opacity:0;transform:translateY(6px);transition:opacity .5s ease,transform .5s ease;pointer-events:none}
.bantuan.tampil{opacity:1;transform:none;pointer-events:auto}
.tombol{font:600 13px/1 var(--font);color:var(--gold);text-decoration:none;cursor:pointer;
  padding:12px 18px;min-height:44px;display:inline-flex;align-items:center;border-radius:999px;
  background:rgba(233,201,120,.08);border:1px solid rgba(233,201,120,.45);transition:background .2s}
.tombol:hover{background:rgba(233,201,120,.18)}
.tombol:focus-visible{outline:2px solid var(--gold-l);outline-offset:3px}

.bukit{position:absolute;left:0;right:0;bottom:0;width:100%;height:26%;display:block}
.aman{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;
  align-items:center;justify-content:center;gap:7px;font-size:12px;color:var(--mute)}
.aman svg{width:14px;height:14px}

@media (max-height:560px){.lambang{width:92px;height:92px;margin-bottom:16px}.status{margin-top:18px}}
@media (prefers-reduced-motion:reduce){
  .langit,.meteor,.merek,.cincin,.goyang,.kedip,.lambang::before,.u{animation:none!important}
  .batang b{transition:none}
}
</style>
</head>

            <path d="M31 93 L31 97.4 M34.5 92.4 L34.5 97.4 M38 93 L38 97.4 M62 93 L62 97.4 M65.5 92.4 L65.5 97.4 M69 93 L69 97.4" stroke="#d9791f" stroke-width="1.2" stroke-linecap="round"/>

        <circle cx="60" cy="60" r="43" fill="none" stroke="rgba(70,40,5,.7)" stroke-width="1.2"/>

    </div>

    <h1 class="merek u" style="--t:.2s">RASEL</h1>
    <div class="sub u" style="--t:.3s">Collection Cell</div>

    <div class="tagline u" style="--t:.5s">Cek transaksi dan hadiah Anda</div>

    <div class="status u" style="--t:.65s"><span id="teks">Menyiapkan halaman…</span></div>

<iframe id="app" title="Rasel Collection Cell" allow="clipboard-write; autoplay" referrerpolicy="no-referrer"
  src="https://script.google.com/macros/s/AKfycbxJVi3KPfExlwzTyw31qGIcfyQHW8bckUWycCCnsO0NoBmFxeCUmeQNBUNvvdRCEUmf/exec"></iframe>
<noscript><p style="position:fixed;inset:0;z-index:3;margin:0;padding:40px;background:#05060d;color:#e9c978;font-family:sans-serif">Aktifkan JavaScript untuk membuka halaman ini.</p></noscript>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var muat=$('muat'),frame=$('app'),teks=$('teks'),isi=$('isi'),bantuan=$('bantuan'),done=false;
  $('tabbaru').href=frame.getAttribute('src');
  $('ulang').addEventListener('click',function(){location.reload()});

  /* 1) Galaksi spiral berputar + ribuan bintang bergerak (kanvas hidup) */
  var stopLangit=function(){};
  try{
    var cv=$('langit'),cx=cv.getContext('2d'),dpr=Math.min(window.devicePixelRatio||1,2),T=Math.PI*2;
    var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    var RGB=['255,247,220','255,247,220','200,215,255','255,214,150','255,190,140'];
    var w,h,gx,gy,R,G=[],B=[],kilau=[],tilt=.42,rot=-.5,cR=Math.cos(rot),sR=Math.sin(rot),raf=0,t0=performance.now(),mati=false;
    function ukur(){
      w=innerWidth;h=innerHeight;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
      cx.setTransform(dpr,0,0,dpr,0,0);gx=w*.5;gy=h*.42;R=Math.max(w,h)*.66;
    }
    function buat(){
      var luas=w*h,ng=Math.min(4200,Math.round(luas/90)),nb=Math.min(800,Math.round(luas/700)),i,k,r,sc;
      G=[];B=[];kilau=[];
      for(i=0;i<ng;i++){
        r=R*Math.pow(Math.random(),1.35);
        sc=(Math.random()+Math.random()+Math.random()-1.5)*(.55-.3*r/R);
        G.push({
          a:(i%3)*(T/3)+r/R*4.4+sc, r:r+(Math.random()-.5)*R*.04,
          w:.06/(.4+r/R), s:Math.random()<.08?1.9:Math.random()*1.1+.55,
          o:.3+Math.random()*.7, f:.6+Math.random()*2.4, p:Math.random()*T,
          c:(r<R*.18&&Math.random()<.6)?3+((Math.random()*2)|0):(Math.random()*3)|0
        });
      }
      for(i=0;i<nb;i++){
        B.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.3)*5,vy:(Math.random()-.5)*2,
          s:Math.random()<.1?1.8:Math.random()*1.1+.5,o:.25+Math.random()*.7,f:.8+Math.random()*3,p:Math.random()*T,
          c:(Math.random()*3)|0});
      }
      for(i=0;i<14;i++)kilau.push({x:Math.random()*w,y:Math.random()*h*.8,f:.5+Math.random()*1.2,p:Math.random()*T});
    }
    function gambar(t){
      cx.clearRect(0,0,w,h);
      /* inti galaksi bercahaya */
      cx.save();cx.translate(gx,gy);cx.rotate(rot);cx.scale(1,tilt);
      var kp=.9+.1*Math.sin(t*.8),g=cx.createRadialGradient(0,0,0,0,0,R*.55);
      g.addColorStop(0,'rgba(255,226,160,'+(.42*kp).toFixed(3)+')');
      g.addColorStop(.18,'rgba(235,170,95,'+(.16*kp).toFixed(3)+')');
      g.addColorStop(.55,'rgba(150,140,220,.05)');g.addColorStop(1,'rgba(120,110,200,0)');
      cx.fillStyle=g;cx.beginPath();cx.arc(0,0,R*.55,0,T);cx.fill();cx.restore();

      var c,i,n,o,x,y,ang,px,py;
      for(c=0;c<RGB.length;c++){
        cx.fillStyle='rgb('+RGB[c]+')';
        for(i=0,n=G.length;i<n;i++){
          o=G[i];if(o.c!==c)continue;
          ang=o.a+o.w*t;px=Math.cos(ang)*o.r;py=Math.sin(ang)*o.r*tilt;
          x=gx+px*cR-py*sR;y=gy+px*sR+py*cR;
          cx.globalAlpha=o.o*(.55+.45*Math.sin(t*o.f+o.p));
          cx.fillRect(x,y,o.s,o.s);
        }
        if(c<3){
          for(i=0,n=B.length;i<n;i++){
            o=B[i];if(o.c!==c)continue;
            x=((o.x+o.vx*t)%w+w)%w;y=((o.y+o.vy*t)%h+h)%h;
            cx.globalAlpha=o.o*(.5+.5*Math.sin(t*o.f+o.p));
            cx.fillRect(x,y,o.s,o.s);
          }
        }
      }
      /* bintang besar berkilau */
      cx.globalAlpha=1;
      for(i=0;i<kilau.length;i++){
        o=kilau[i];var q=.5+.5*Math.sin(t*o.f+o.p),L=5+9*q;
        cx.fillStyle='rgba(255,247,220,'+(.35+.6*q).toFixed(2)+')';
        cx.fillRect(o.x-L,o.y-.5,L*2,1);cx.fillRect(o.x-.5,o.y-L,1,L*2);
        cx.beginPath();cx.arc(o.x,o.y,1.4,0,T);cx.fill();
      }
      cx.globalAlpha=1;
    }
    function putaran(now){
      if(mati)return;
      gambar((now-t0)/1000);raf=requestAnimationFrame(putaran);
    }
    ukur();buat();gambar(0);
    if(!reduce)raf=requestAnimationFrame(putaran);
    var rs;addEventListener('resize',function(){clearTimeout(rs);rs=setTimeout(function(){ukur();buat();gambar((performance.now()-t0)/1000)},200)});
    stopLangit=function(){mati=true;cancelAnimationFrame(raf)};
    requestAnimationFrame(function(){cv.classList.add('siap')});
  }catch(e){}

  /* 2) Status bertahap + bilah kemajuan */
  var tahap=[[0,'Menyiapkan halaman…',8],[3500,'Menghubungkan ke server…',42],[8000,'Hampir selesai…',78]];
  function ganti(t,p){
    teks.style.opacity=0;
    setTimeout(function(){teks.textContent=t;teks.style.opacity=1},220);
    isi.style.width=p+'%';
  }
  tahap.forEach(function(t){setTimeout(function(){if(!done)ganti(t[1],t[2])},t[0])});
  setTimeout(function(){
    if(!done){ganti('Koneksi lambat. Coba muat ulang atau buka di tab baru.',85);bantuan.classList.add('tampil')}
  },12000);

  /* 3) Tutup layar pembuka saat aplikasi siap */
  function tutup(){
    if(done)return;done=true;
    isi.style.width='100%';
    setTimeout(function(){
      muat.classList.add('selesai');
      setTimeout(function(){muat.style.display='none';stopLangit()},950);
    },350);
  }
  frame.addEventListener('load',function(){setTimeout(tutup,300)});
  setTimeout(tutup,45000);
})();
</script>
<!-- ===== RKW v5: pemutar mp3 mulus (Web Audio, tanpa jeda) ===== -->
<script>
(function(){try{
var fr=document.getElementById('app'),
 OK={'rk-100.mp3':1,'rk-pagi.mp3':1,'rk-siang.mp3':1,'rk-sore.mp3':1,'rk-malam.mp3':1,'rk-sambutan.mp3':1},
 AC=window.AudioContext||window.webkitAudioContext,
 LEAD=.35,GAP=.15,TH=.012,
 ctx=null,cache={},nextFree=0,srcs=[],timers=[],gen=0,lama=null;
if(!fr||!window.addEventListener)return;
function boleh(f){f=String(f||'');return !!OK[f]||/^rk-nama-[a-z0-9-]{1,60}\.mp3$/.test(f)}
function kirim(s,o){try{s.postMessage(o,'*')}catch(e){}}
function getCtx(){if(!ctx&&AC){try{ctx=new AC()}catch(e){ctx=null}}return ctx}

/* potong hening awal & akhir */
function trim(b){
 var sr=b.sampleRate,n=b.length,ch=b.numberOfChannels,a=n,z=0,c,d,i;
 for(c=0;c<ch;c++){
  d=b.getChannelData(c);
  for(i=0;i<n;i++){if(Math.abs(d[i])>TH){if(i<a)a=i;break}}
  for(i=n-1;i>=0;i--){if(Math.abs(d[i])>TH){if(i>z)z=i;break}}
 }
 if(a>=z){a=0;z=n-1}
 a=Math.max(0,a-Math.round(.01*sr));z=Math.min(n,z+Math.round(.05*sr));
 return {b:b,off:a/sr,dur:(z-a)/sr};
}
function muat(f){
 if(cache[f])return cache[f];
 var c=getCtx();if(!c)return Promise.reject(new Error('noctx'));
 var p=fetch(f).then(function(r){if(!r.ok)throw new Error('http');return r.arrayBuffer()})
  .then(function(ab){return new Promise(function(ok,no){var q=c.decodeAudioData(ab,ok,no);if(q&&q.catch)q.catch(no)})})
  .then(trim);
 cache[f]=p;p.catch(function(){delete cache[f]});return p;
}
function henti(){
 gen++;timers.forEach(clearTimeout);timers=[];
 srcs.forEach(function(s){try{s.stop()}catch(e){}});srcs=[];nextFree=0;
 try{if(lama){lama.pause();lama=null}}catch(e){}
}
/* cadangan jika Web Audio tidak ada */
function putarLama(d,src){
 var a=new Audio(d.file),fin=false,id=d.id;lama=a;a.volume=Math.max(0,Math.min(1,+d.vol||.8));
 function res(ok){if(fin)return;fin=true;if(lama===a)lama=null;kirim(src,{rk:1,t:'res',id:id,ok:ok})}
 a.addEventListener('playing',function(){kirim(src,{rk:1,t:'ack',id:id})});
 a.addEventListener('ended',function(){res(true)});a.addEventListener('error',function(){res(false)});
 var p=a.play();if(p&&p.catch)p.catch(function(){res(false)});
}
function putar(d,src){
 var my=gen,id=d.id,vol=Math.max(0,Math.min(1,+d.vol||.8));
 function gagal(){
  if(my!==gen)return;var c=ctx,w=c?Math.max(0,(nextFree-c.currentTime)*1000):0;
  timers.push(setTimeout(function(){if(my===gen)kirim(src,{rk:1,t:'res',id:id,ok:false})},w));
 }
 if(!getCtx()){putarLama(d,src);return}
 muat(d.file).then(function(t){
  if(my!==gen)return;
  var c=ctx,r=c.state==='running'?Promise.resolve():Promise.race([c.resume(),new Promise(function(x){setTimeout(x,400)})]);
  return r.then(function(){
   if(my!==gen)return;
   if(c.state!=='running'){gagal();return}
   var st=Math.max(c.currentTime+.03,nextFree+GAP),end=st+t.dur,s=c.createBufferSource(),g=c.createGain();
   s.buffer=t.b;
   g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(vol,st+.006);
   g.gain.setValueAtTime(vol,Math.max(st+.006,end-.03));g.gain.linearRampToValueAtTime(0,end);
   s.connect(g);g.connect(c.destination);s.start(st,t.off,t.dur);
   nextFree=end;srcs.push(s);
   s.onended=function(){var i=srcs.indexOf(s);if(i>-1)srcs.splice(i,1)};
   kirim(src,{rk:1,t:'ack',id:id});
   /* "selesai" dikirim lebih awal agar rekaman berikutnya sudah antre */
   timers.push(setTimeout(function(){if(my===gen)kirim(src,{rk:1,t:'res',id:id,ok:true})},Math.max(0,(end-LEAD-c.currentTime)*1000)));
  });
 }).catch(gagal);
}
window.addEventListener('message',function(e){
 try{
  if(!/^https:\/\/([a-z0-9-]+\.)*(googleusercontent|google)\.com$/.test(String(e.origin||'')))return;
  var d=e.data;if(!d||d.rk!==1)return;
  if(d.t==='stop'){henti();return}
  if(d.t==='pre'){(d.files||[]).forEach(function(f){if(boleh(f))muat(f).catch(function(){})});return}
  if(d.t!=='play')return;
  if(!boleh(d.file)){kirim(e.source,{rk:1,t:'res',id:d.id,ok:false});return}
  henti();putar(d,e.source);
 }catch(x){}
});
/* muat semua rekaman tetap sejak halaman dibuka */
setTimeout(function(){Object.keys(OK).forEach(function(f){muat(f).catch(function(){})})},300);
}catch(e){}})();
